<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c16">
<title>Chessport</title>

<script src="https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/chess.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#080c16;
  color:white;
  min-height:100vh;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.screen{
  min-height:100vh;
  padding:20px 12px 40px;
}

.header{
  text-align:center;
  padding:35px 10px 25px;
}

.logo{
  font-size:50px;
  font-weight:900;
  letter-spacing:-2px;
}

.logo span{
  color:#3b82f6;
}

.subtitle{
  margin-top:10px;
  color:#aeb8ca;
  font-size:18px;
}

.card{
  max-width:650px;
  margin:18px auto;
  background:#11182a;
  border:1px solid #273550;
  border-radius:25px;
  padding:25px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.big-btn{
  width:100%;
  border:0;
  border-radius:17px;
  padding:18px;
  margin:8px 0;
  background:#2563eb;
  color:white;
  font-size:20px;
  font-weight:bold;
}

.big-btn.secondary{
  background:#1b263d;
}

.big-btn:hover{
  filter:brightness(1.12);
}

.title{
  text-align:center;
  font-size:30px;
  margin-bottom:25px;
}

.label{
  display:block;
  color:#aeb8ca;
  margin:18px 0 10px;
  font-size:17px;
  font-weight:bold;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.option{
  border:2px solid #293750;
  background:#0d1423;
  color:white;
  padding:14px;
  border-radius:14px;
  font-size:16px;
}

.option.selected{
  border-color:#3b82f6;
  background:#172b51;
}

.themes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.theme{
  border:3px solid transparent;
  border-radius:14px;
  overflow:hidden;
  background:#0b1120;
  padding:5px;
  color:white;
}

.theme.selected{
  border-color:#3b82f6;
}

.theme-board{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  aspect-ratio:1;
}

.theme-board div{
  min-height:20px;
}

.theme-name{
  text-align:center;
  padding:7px 2px;
  font-size:13px;
}

.theme-classic .light,
.classic .light{
  background:#f0d9b5;
}

.theme-classic .dark,
.classic .dark{
  background:#b58863;
}

.theme-green .light,
.green .light{
  background:#eeeed2;
}

.theme-green .dark,
.green .dark{
  background:#769656;
}

.theme-blue .light,
.blue .light{
  background:#d9e8f5;
}

.theme-blue .dark,
.blue .dark{
  background:#4f81a8;
}

.theme-wood .light,
.wood .light{
  background:#e8cfa7;
}

.theme-wood .dark,
.wood .dark{
  background:#9a633d;
}

.theme-gray .light,
.gray .light{
  background:#dedede;
}

.theme-gray .dark,
.gray .dark{
  background:#777;
}

.theme-purple .light,
.purple .light{
  background:#eadcf2;
}

.theme-purple .dark,
.purple .dark{
  background:#80649a;
}

.game-wrap{
  max-width:850px;
  margin:auto;
}

.game-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}

.player-box{
  background:#11182a;
  border:1px solid #273550;
  border-radius:15px;
  padding:10px 15px;
  flex:1;
  text-align:center;
}

.player-name{
  font-weight:bold;
  margin-bottom:5px;
}

.clock{
  font-size:28px;
  font-weight:900;
  background:#070b14;
  border-radius:10px;
  padding:7px;
}

.clock.active{
  outline:3px solid #2563eb;
}

.board-container{
  width:min(94vw,700px);
  margin:auto;
  border:7px solid #0a0f1b;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  aspect-ratio:1;
}

.square{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:none;
  touch-action:manipulation;
  font-size:clamp(31px,9vw,67px);
  line-height:1;
}

.square.light{
  background:#f0d9b5;
}

.square.dark{
  background:#b58863;
}

.square.selected{
  box-shadow:inset 0 0 0 5px #22c55e;
}

.square.last{
  box-shadow:inset 0 0 0 5px rgba(250,204,21,.65);
}

.square.legal::after{
  content:"";
  width:22%;
  height:22%;
  background:rgba(20,30,20,.35);
  border-radius:50%;
  position:absolute;
}

.square.capture::after{
  content:"";
  width:75%;
  height:75%;
  border:5px solid rgba(200,40,40,.55);
  border-radius:50%;
  position:absolute;
}

.piece{
  position:relative;
  z-index:2;
  font-family:"Times New Roman",serif;
}

.white-piece{
  color:#fff;
  text-shadow:0 2px 2px #555;
}

.black-piece{
  color:#171717;
  text-shadow:0 1px 1px #aaa;
}

.game-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:18px;
}

.history{
  background:#11182a;
  border:1px solid #273550;
  border-radius:18px;
  padding:17px;
  min-height:120px;
}

.history h3{
  margin-bottom:12px;
}

.moves{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  color:#dce5f5;
}

.move{
  background:#1a2539;
  padding:6px 9px;
  border-radius:8px;
  font-size:14px;
}

.controls{
  background:#11182a;
  border:1px solid #273550;
  border-radius:18px;
  padding:17px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.control{
  border:0;
  background:#1b263d;
  color:white;
  padding:12px 8px;
  border-radius:11px;
  font-weight:bold;
}

.control.primary{
  background:#2563eb;
}

.status{
  text-align:center;
  margin:15px 0;
  font-size:19px;
  font-weight:bold;
  min-height:25px;
}

.back{
  display:block;
  width:100%;
  max-width:650px;
  margin:15px auto 0;
  border:0;
  background:#27344d;
  color:white;
  padding:14px;
  border-radius:14px;
  font-size:17px;
}

@media(max-width:600px){

  .screen{
    padding:12px 10px 30px;
  }

  .logo{
    font-size:38px;
  }

  .subtitle{
    font-size:16px;
  }

  .card{
    padding:17px;
  }

  .themes{
    grid-template-columns:repeat(2,1fr);
  }

  .game-info{
    grid-template-columns:1fr;
  }

  .game-top{
    gap:6px;
  }

  .player-box{
    padding:8px;
  }

  .clock{
    font-size:22px;
  }
}
</style>
</head>

<body>

<!-- الرئيسية -->
<section id="home" class="screen">

  <div class="header">
    <div class="logo">
      Chess<span>port</span> ♟
    </div>

    <div class="subtitle">
      منصة شطرنج عربية — تعمل على الهاتف والكمبيوتر
    </div>
  </div>

  <div class="card">

    <button class="big-btn" onclick="showSetup()">
      ♟️ لعب مباراة جديدة
    </button>

    <button class="big-btn secondary"
      onclick="alert('قسم البطولات سيتم تطويره قريبًا 🏆')">
      🏆 البطولات
    </button>

    <button class="big-btn secondary"
      onclick="alert('قسم تعلم الشطرنج سيتم تطويره قريبًا 📚')">
      📚 تعلم الشطرنج
    </button>

  </div>

</section>


<!-- إعداد المباراة -->
<section id="setup" class="screen hidden">

  <div class="card">

    <h1 class="title">
      ⚙️ إعداد المباراة
    </h1>

    <div class="label">
      اختر لونك
    </div>

    <div class="options">

      <button id="whiteBtn"
        class="option selected"
        onclick="chooseColor('w')">
        ⚪ الأبيض
      </button>

      <button id="blackBtn"
        class="option"
        onclick="chooseColor('b')">
        ⚫ الأسود
      </button>

    </div>


    <div class="label">
      وقت المباراة
    </div>

    <div class="options">

      <button class="option selected timeOption"
        onclick="chooseTime(10,this)">
        10 دقائق
      </button>

      <button class="option timeOption"
        onclick="chooseTime(5,this)">
        5 دقائق
      </button>

      <button class="option timeOption"
        onclick="chooseTime(3,this)">
        3 دقائق
      </button>

      <button class="option timeOption"
        onclick="chooseTime(15,this)">
        15 دقيقة
      </button>

    </div>


    <div class="label">
      🎨 اختر الرقعة
    </div>

    <div class="themes">

      <button class="theme selected"
        onclick="chooseTheme('classic',this)">

        <div class="theme-board">
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
        </div>

        <div class="theme-name">كلاسيك</div>

      </button>


      <button class="theme"
        onclick="chooseTheme('green',this)">

        <div class="theme-board">
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
        </div>

        <div class="theme-name">أخضر</div>

      </button>


      <button class="theme"
        onclick="chooseTheme('blue',this)">

        <div class="theme-board">
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
        </div>

        <div class="theme-name">أزرق</div>

      </button>


      <button class="theme"
        onclick="chooseTheme('wood',this)">

        <div class="theme-board">
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
        </div>

        <div class="theme-name">خشبي</div>

      </button>


      <button class="theme"
        onclick="chooseTheme('gray',this)">

        <div class="theme-board">
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
        </div>

        <div class="theme-name">رمادي</div>

      </button>


      <button class="theme"
        onclick="chooseTheme('purple',this)">

        <div class="theme-board">
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="light"></div><div class="dark"></div>
          <div class="dark"></div><div class="light"></div>
          <div class="dark"></div><div class="light"></div>
        </div>

        <div class="theme-name">بنفسجي</div>

      </button>

    </div>


    <button class="big-btn" onclick="startGame()">
      🚀 ابدأ المباراة
    </button>

    <button class="back" onclick="showHome()">
      ← العودة للرئيسية
    </button>

  </div>

</section>


<!-- اللعبة -->
<section id="game" class="screen hidden">

  <div class="game-wrap">

    <div class="game-top">

      <div class="player-box">
        <div class="player-name">
          الأسود ⚫
        </div>

        <div id="blackClock" class="clock">
          10:00
        </div>
      </div>


      <div class="player-box">
        <div class="player-name">
          الأبيض ⚪
        </div>

        <div id="whiteClock" class="clock">
          10:00
        </div>
      </div>

    </div>


    <div id="status" class="status">
      دور الأبيض ⚪
    </div>


    <div id="boardContainer"
      class="board-container">

      <div id="board"
        class="board">
      </div>

    </div>


    <div class="game-info">

      <div class="history">

        <h3>
          📜 النقلات
        </h3>

        <div id="moves"
          class="moves">
        </div>

      </div>


      <div class="controls">

        <button class="control"
          onclick="undoMove()">
          ↩️ تراجع
        </button>

        <button class="control"
          onclick="resetGame()">
          🔄 إعادة
        </button>

        <button class="control primary"
          onclick="showHome()">
          🏠 الرئيسية
        </button>

        <button class="control"
          onclick="flipBoard()">
          🔃 قلب الرقعة
        </button>

      </div>

    </div>

  </div>

</section>


<script>

let game = new Chess();

let selectedSquare = null;

let playerColor = "w";

let selectedTime = 10;

let selectedTheme = "classic";

let flipped = false;

let clocks = {
  w: 600,
  b: 600
};

let timer = null;


/* ===== التنقل ===== */

function showHome(){

  stopClock();

  document.getElementById("home")
    .classList.remove("hidden");

  document.getElementById("setup")
    .classList.add("hidden");

  document.getElementById("game")
    .classList.add("hidden");
}


function showSetup(){

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("setup")
    .classList.remove("hidden");

  document.getElementById("game")
    .classList.add("hidden");
}


/* ===== الإعدادات ===== */

function chooseColor(color){

  playerColor = color;

  document.getElementById("whiteBtn")
    .classList.toggle("selected",color==="w");

  document.getElementById("blackBtn")
    .classList.toggle("selected",color==="b");
}


function chooseTime(minutes,button){

  selectedTime = minutes;

  document.querySelectorAll(".timeOption")
    .forEach(b=>b.classList.remove("selected"));

  button.classList.add("selected");
}


function chooseTheme(theme,button){

  selectedTheme = theme;

  document.querySelectorAll(".theme")
    .forEach(b=>b.classList.remove("selected"));

  button.classList.add("selected");
}


/* ===== بدء المباراة ===== */

function startGame(){

  game = new Chess();

  selectedSquare = null;

  clocks.w = selectedTime * 60;
  clocks.b = selectedTime * 60;

  flipped = playerColor === "b";

  document.getElementById("setup")
    .classList.add("hidden");

  document.getElementById("game")
    .classList.remove("hidden");

  updateClockDisplay();

  renderBoard();

  updateStatus();

  startClock();
}


/* ===== الرقعة ===== */

const pieces = {

  p:"♟",
  r:"♜",
  n:"♞",
  b:"♝",
  q:"♛",
  k:"♚",

  P:"♙",
  R:"♖",
  N:"♘",
  B:"♗",
  Q:"♕",
  K:"♔"

};


function renderBoard(){

  const board = document.getElementById("board");

  board.innerHTML = "";

  let position = game.board();

  if(flipped){

    position = position
      .slice()
      .reverse()
      .map(row=>row.slice().reverse());

  }

  position.forEach((row,rowIndex)=>{

    row.forEach((piece,colIndex)=>{

      const square = document.createElement("div");

      let actualRow = flipped
        ? 7-rowIndex
        : rowIndex;

      let actualCol = flipped
        ? 7-colIndex
        : colIndex;

      const squareName =
        String.fromCharCode(97+actualCol)
        +(8-actualRow);

      square.className =
        "square "
        + ((actualRow+actualCol)%2===0
        ? "light"
        : "dark");

      if(selectedSquare === squareName){

        square.classList.add("selected");

      }

      if(piece){

        const span =
          document.createElement("span");

        span.className =
          "piece "
          +(piece.color==="w"
          ? "white-piece"
          : "black-piece");

        span.textContent =
          pieces[
            piece.color==="w"
            ? piece.type.toUpperCase()
            : piece.type
          ];

        square.appendChild(span);

      }

      square.onclick =
        ()=>handleSquareClick(squareName);

      board.appendChild(square);

    });

  }

  applyTheme();

}


/* ===== اللعب ===== */

function handleSquareClick(square){

  if(game.isGameOver()) return;

  const piece =
    game.get(square);

  if(!selectedSquare){

    if(piece && piece.color === game.turn()){

      selectedSquare = square;

      renderBoard();

    }

    return;

  }


  if(selectedSquare === square){

    selectedSquare = null;

    renderBoard();

    return;

  }


  try{

    const move = game.move({

      from:selectedSquare,

      to:square,

      promotion:"q"

    });

    if(move){

      selectedSquare = null;

      renderBoard();

      updateMoves();

      updateStatus();

      if(game.isGameOver()){

        stopClock();

      }

      return;

    }

  }catch(error){}


  if(piece && piece.color === game.turn()){

    selectedSquare = square;

  }else{

    selectedSquare = null;

  }

  renderBoard();

}


/* ===== النقلات ===== */

function updateMoves(){

  const container =
    document.getElementById("moves");

  container.innerHTML = "";

  game.history().forEach((move,index)=>{

    const span =
      document.createElement("span");

    span.className = "move";

    span.textContent =
      (index+1)+". "+move;

    container.appendChild(span);

  });

}


/* ===== الحالة ===== */

function updateStatus(){

  const status =
    document.getElementById("status");

  if(game.isCheckmate()){

    status.textContent =
      "♔ كش مات — انتهت المباراة";

    return;

  }

  if(game.isDraw()){

    status.textContent =
      "🤝 تعادل";

    return;

  }

  if(game.inCheck()){

    status.textContent =
      "⚠️ كش! دور "
      +(game.turn()==="w"
      ? "الأبيض ⚪"
      : "الأسود ⚫");

    return;

  }

  status.textContent =
    "دور "
    +(game.turn()==="w"
    ? "الأبيض ⚪"
    : "الأسود ⚫");
}


/* ===== الساعة ===== */

function startClock(){

  stopClock();

  timer = setInterval(()=>{

    if(game.isGameOver()){

      stopClock();

      return;

    }

    const turn = game.turn();

    clocks[turn]--;

    if(clocks[turn] <= 0){

      clocks[turn] = 0;

      stopClock();

      document.getElementById("status")
        .textContent =
        "⏱️ انتهى الوقت — "
        +(turn==="w"
        ? "الأسود"
        : "الأبيض")
        +" يفوز بالوقت";

    }

    updateClockDisplay();

  },1000);

}


function stopClock(){

  if(timer){

    clearInterval(timer);

    timer = null;

  }

}


function updateClockDisplay(){

  document.getElementById("whiteClock")
    .textContent =
    formatTime(clocks.w);

  document.getElementById("blackClock")
    .textContent =
    formatTime(clocks.b);

}


function formatTime(seconds){

  const minutes =
    Math.floor(seconds/60);

  const secs =
    seconds%60;

  return String(minutes)
    .padStart(2,"0")
    +":"
    +String(secs)
    .padStart(2,"0");

}


/* ===== أدوات ===== */

function resetGame(){

  startGame();

}


function undoMove(){

  if(game.history().length===0)
    return;

  game.undo();

  selectedSquare = null;

  renderBoard();

  updateMoves();

  updateStatus();

}


function flipBoard(){

  flipped = !flipped;

  renderBoard();

}


/* ===== الثيم ===== */

function applyTheme(){

  const board =
    document.getElementById("board");

  board.classList.remove(
    "classic",
    "green",
    "blue",
    "wood",
    "gray",
    "purple"
  );

  board.classList.add(selectedTheme);

}

showHome();

</script>

</body>
      </html>
