<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chessport ♟</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#080d18;
  color:white;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.app{
  max-width:650px;
  margin:auto;
  min-height:100vh;
  padding:18px;
}

/* ===== الشاشات ===== */

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.logo{
  text-align:center;
  font-size:38px;
  font-weight:bold;
  margin:25px 0 8px;
}

.subtitle{
  text-align:center;
  color:#aeb8ca;
  font-size:17px;
  margin-bottom:35px;
}

.card{
  background:#121a2b;
  border:1px solid #263451;
  border-radius:22px;
  padding:20px;
  margin-bottom:16px;
}

.mainBtn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:17px;
  margin:7px 0;
  font-size:18px;
  font-weight:bold;
  background:#253453;
  color:white;
}

.mainBtn.primary{
  background:#5b48d6;
}

.back{
  border:0;
  background:#202b40;
  color:white;
  border-radius:12px;
  padding:10px 16px;
  font-size:16px;
}

/* ===== الإعدادات ===== */

h2{
  margin-top:8px;
}

.optionTitle{
  color:#aeb8ca;
  margin:20px 0 10px;
}

.options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.option{
  background:#202b40;
  color:white;
  border:2px solid transparent;
  border-radius:13px;
  padding:14px;
  font-size:16px;
}

.option.selected{
  border-color:#8b7cff;
  background:#30296a;
}

.start{
  width:100%;
  margin-top:25px;
  padding:17px;
  border:0;
  border-radius:15px;
  background:#5b48d6;
  color:white;
  font-size:19px;
  font-weight:bold;
}

/* ===== الرقعة ===== */

.gameTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.timer{
  background:#070b14;
  padding:13px 20px;
  border-radius:14px;
  font-size:25px;
  font-weight:bold;
  min-width:105px;
  text-align:center;
}

.player{
  font-weight:bold;
  color:#b9c2d4;
}

.boardWrap{
  width:100%;
  aspect-ratio:1;
  padding:5px;
  background:#050912;
  border-radius:18px;
  overflow:hidden;
}

.board{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-radius:13px;
  overflow:hidden;
}

.square{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(28px,9vw,55px);
  user-select:none;
}

.square.light{
  background:#f0d9b5;
}

.square.dark{
  background:#b58863;
}

/* ===== 6 رقعات ===== */

.theme1 .light{background:#f0d9b5}
.theme1 .dark{background:#b58863}

.theme2 .light{background:#eeeeee}
.theme2 .dark{background:#769656}

.theme3 .light{background:#e8edf5}
.theme3 .dark{background:#64748b}

.theme4 .light{background:#f5e6c8}
.theme4 .dark{background:#9b6b43}

.theme5 .light{background:#e8d9ff}
.theme5 .dark{background:#7654a8}

.theme6 .light{background:#d9f3f0}
.theme6 .dark{background:#328b87}

.piece{
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));
  line-height:1;
}

/* الهلال بدل الصليب */

.king{
  font-family:Arial,sans-serif;
  font-weight:bold;
}

.whitePiece{
  color:#fff;
  text-shadow:0 2px 3px #555;
}

.blackPiece{
  color:#111;
  text-shadow:0 1px 1px #fff;
}

.selectedSquare{
  box-shadow:inset 0 0 0 5px rgba(255,210,50,.8);
}

.moveHint::after{
  content:"";
  width:18px;
  height:18px;
  background:rgba(40,120,40,.65);
  border-radius:50%;
  position:absolute;
}

.lastMove{
  box-shadow:inset 0 0 0 4px rgba(255,215,0,.45);
}

/* ===== سجل النقلات ===== */

.history{
  margin-top:15px;
  background:#111a2a;
  border-radius:17px;
  padding:15px;
}

.historyTitle{
  font-size:19px;
  font-weight:bold;
  margin-bottom:10px;
}

.moves{
  max-height:170px;
  overflow:auto;
  color:#d5dbea;
}

.moveRow{
  display:grid;
  grid-template-columns:40px 1fr 1fr;
  padding:7px 3px;
  border-bottom:1px solid #263148;
}

.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.control{
  border:0;
  background:#202b40;
  color:white;
  border-radius:12px;
  padding:12px 5px;
}

.themeButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.themeBtn{
  height:45px;
  border:3px solid transparent;
  border-radius:10px;
}

.themeBtn.active{
  border-color:white;
}

.t1{background:linear-gradient(135deg,#f0d9b5 50%,#b58863 50%)}
.t2{background:linear-gradient(135deg,#eee 50%,#769656 50%)}
.t3{background:linear-gradient(135deg,#e8edf5 50%,#64748b 50%)}
.t4{background:linear-gradient(135deg,#f5e6c8 50%,#9b6b43 50%)}
.t5{background:linear-gradient(135deg,#e8d9ff 50%,#7654a8 50%)}
.t6{background:linear-gradient(135deg,#d9f3f0 50%,#328b87 50%)}
</style>
</head>

<body>

<div class="app">

<!-- ================= الرئيسية ================= -->

<section id="home" class="screen active">

  <div class="logo">Chessport ☾</div>

  <div class="subtitle">
    منصة شطرنج عربية — تعمل على الهاتف والكمبيوتر
  </div>

  <div class="card">
    <button class="mainBtn primary" onclick="showScreen('setup')">
      ♟ لعب مباراة جديدة
    </button>

    <button class="mainBtn">
      🏆 البطولات
    </button>

    <button class="mainBtn">
      📚 تعلم الشطرنج
    </button>

    <button class="mainBtn">
      ⚙ الإعدادات
    </button>
  </div>

</section>


<!-- ================= إعداد المباراة ================= -->

<section id="setup" class="screen">

  <button class="back" onclick="showScreen('home')">← رجوع</button>

  <div class="card">

    <h2>إعداد المباراة</h2>

    <div class="optionTitle">اللون</div>

    <div class="options">
      <button class="option selected" onclick="selectOption(this)">
        ⚪ الأبيض
      </button>

      <button class="option" onclick="selectOption(this)">
        ⚫ الأسود
      </button>
    </div>

    <div class="optionTitle">الوقت</div>

    <div class="options">
      <button class="option selected" onclick="selectOption(this)">
        5 + 0
      </button>

      <button class="option" onclick="selectOption(this)">
        10 + 0
      </button>

      <button class="option" onclick="selectOption(this)">
        10 + 5
      </button>

      <button class="option" onclick="selectOption(this)">
        15 + 10
      </button>
    </div>

    <div class="optionTitle">اختر الرقعة</div>

    <div class="themeButtons">

      <button class="themeBtn t1 active" onclick="chooseTheme(1,this)"></button>

      <button class="themeBtn t2" onclick="chooseTheme(2,this)"></button>

      <button class="themeBtn t3" onclick="chooseTheme(3,this)"></button>

      <button class="themeBtn t4" onclick="chooseTheme(4,this)"></button>

      <button class="themeBtn t5" onclick="chooseTheme(5,this)"></button>

      <button class="themeBtn t6" onclick="chooseTheme(6,this)"></button>

    </div>

    <button class="start" onclick="startGame()">
      ابدأ المباراة ♟
    </button>

  </div>

</section>


<!-- ================= المباراة ================= -->

<section id="game" class="screen">

  <div class="gameTop">

    <button class="back" onclick="showScreen('setup')">
      ⚙
    </button>

    <div class="player">الأسود ⚫</div>

    <div id="blackClock" class="timer">5:00</div>

  </div>

  <div id="boardWrap" class="boardWrap theme1">

    <div id="board" class="board"></div>

  </div>

  <div class="gameTop" style="margin-top:12px">

    <div class="player">الأبيض ⚪</div>

    <div id="whiteClock" class="timer">5:00</div>

  </div>


  <!-- سجل النقلات -->

  <div class="history">

    <div class="historyTitle">
      📜 سجل النقلات
    </div>

    <div id="moves" class="moves">
      <div style="color:#8792a8">
        لم تبدأ أي نقلة بعد
      </div>
    </div>

  </div>


  <div class="controls">

    <button class="control" onclick="undoMove()">
      ↩ تراجع
    </button>

    <button class="control" onclick="flipBoard()">
      🔄 قلب الرقعة
    </button>

    <button class="control" onclick="newGame()">
      🆕 مباراة جديدة
    </button>

  </div>

</section>

</div>


<script>

/* =========================================
   بيانات اللعبة
========================================= */

const pieces = {
  r:"♜",
  n:"♞",
  b:"♝",
  q:"♛",
  k:"☾",
  p:"♟"
};

let boardState = [
 ["r","n","b","q","k","b","n","r"],
 ["p","p","p","p","p","p","p","p"],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["","","","","","","",""],
 ["P","P","P","P","P","P","P","P"],
 ["R","N","B","Q","K","B","N","R"]
];

let selected = null;
let turn = "white";
let history = [];
let flipped = false;
let theme = 1;

let whiteSeconds = 300;
let blackSeconds = 300;
let timerInterval = null;


/* =========================================
   الانتقال بين الواجهات
========================================= */

function showScreen(id){

  document.querySelectorAll(".screen")
    .forEach(s => s.classList.remove("active"));

  document.getElementById(id)
    .classList.add("active");
}


/* =========================================
   اختيار الإعداد
========================================= */

function selectOption(btn){

  const group = btn.parentElement;

  group.querySelectorAll(".option")
    .forEach(x => x.classList.remove("selected"));

  btn.classList.add("selected");
}


function chooseTheme(number,btn){

  theme = number;

  document.querySelectorAll(".themeBtn")
    .forEach(x => x.classList.remove("active"));

  btn.classList.add("active");

  document.getElementById("boardWrap").className =
    "boardWrap theme" + number;
}


/* =========================================
   بدء اللعبة
========================================= */

function startGame(){

  resetBoard();

  showScreen("game");

  renderBoard();

  startClock();
}


/* =========================================
   إعادة الرقعة
========================================= */

function resetBoard(){

  boardState = [
   ["r","n","b","q","k","b","n","r"],
   ["p","p","p","p","p","p","p","p"],
   ["","","","","","","",""],
   ["","","","","","","",""],
   ["","","","","","","",""],
   ["","","","","","","",""],
   ["P","P","P","P","P","P","P","P"],
   ["R","N","B","Q","K","B","N","R"]
  ];

  selected = null;
  turn = "white";
  history = [];
  flipped = false;

  whiteSeconds = 300;
  blackSeconds = 300;

  document.getElementById("moves").innerHTML =
    '<div style="color:#8792a8">لم تبدأ أي نقلة بعد</div>';

  clearInterval(timerInterval);
}


/* =========================================
   رسم الرقعة
========================================= */

function renderBoard(){

  const board = document.getElementById("board");

  board.innerHTML = "";

  for(let displayRow=0; displayRow<8; displayRow++){

    let r = flipped ? 7-displayRow : displayRow;

    for(let displayCol=0; displayCol<8; displayCol++){

      let c = flipped ? 7-displayCol : displayCol;

      const square = document.createElement("div");

      square.className =
        "square " +
        (((r+c)%2===0) ? "light" : "dark");

      if(selected &&
         selected.r===r &&
         selected.c===c){

        square.classList.add("selectedSquare");
      }

      const piece = boardState[r][c];

      if(piece){

        const span = document.createElement("span");

        span.className =
          "piece " +
          (piece===piece.toUpperCase()
            ? "whitePiece"
            : "blackPiece");

        if(piece.toLowerCase()==="k")
          span.classList.add("king");

        span.textContent =
          pieces[piece.toLowerCase()];

        square.appendChild(span);
      }

      square.onclick = () => clickSquare(r,c);

      board.appendChild(square);
    }
  }
}


/* =========================================
   الضغط على مربع
========================================= */

function clickSquare(r,c){

  const piece = boardState[r][c];

  if(selected){

    if(selected.r===r && selected.c===c){

      selected = null;
      renderBoard();
      return;
    }

    if(piece &&
       ((piece===piece.toUpperCase()) === (turn==="white"))){

      selected = {r,c};
      renderBoard();
      return;
    }

    movePiece(selected.r,selected.c,r,c);

    selected = null;

    renderBoard();

  }else{

    if(piece &&
       ((piece===piece.toUpperCase()) === (turn==="white"))){

      selected = {r,c};

      renderBoard();
    }
  }
}


/* =========================================
   تحريك القطعة
========================================= */

function movePiece(fr,fc,tr,tc){

  const piece = boardState[fr][fc];

  if(!piece) return;

  const captured = boardState[tr][tc];

  boardState[tr][tc] = piece;
  boardState[fr][fc] = "";

  history.push({
    fr,fc,tr,tc,
    piece,
    captured
  });

  addMoveToHistory(fr,fc,tr,tc,piece,captured);

  turn = turn==="white" ? "black" : "white";
}


/* =========================================
   سجل النقلات
========================================= */

function squareName(r,c){

  const files = ["a","b","c","d","e","f","g","h"];

  return files[c] + (8-r);
}


function addMoveToHistory(fr,fc,tr,tc,piece,captured){

  const moves = document.getElementById("moves");

  if(history.length===1)
    moves.innerHTML = "";

  let rows = moves.querySelectorAll(".moveRow");

  let number = Math.ceil(history.length/2);

  if(history.length%2===1){

    const row = document.createElement("div");

    row.className = "moveRow";

    row.innerHTML =
      "<span>"+number+".</span>" +
      "<span>"+squareName(fr,fc)+"-"+squareName(tr,tc)+"</span>" +
      "<span></span>";

    moves.appendChild(row);

  }else{

    const row = rows[rows.length-1];

    row.children[2].textContent =
      squareName(fr,fc)+"-"+squareName(tr,tc);
  }

  moves.scrollTop = moves.scrollHeight;
}


/* =========================================
   تراجع
========================================= */

function undoMove(){

  if(history.length===0) return;

  const last = history.pop();

  boardState[last.fr][last.fc] = last.piece;

  boardState[last.tr][last.tc] = last.captured;

  turn = turn==="white" ? "black" : "white";

  rebuildHistory();

  renderBoard();
}


function rebuildHistory(){

  const moves = document.getElementById("moves");

  moves.innerHTML = "";

  if(history.length===0){

    moves.innerHTML =
      '<div style="color:#8792a8">لم تبدأ أي نقلة بعد</div>';

    return;
  }

  history.forEach((m,i)=>{

    if(i%2===0){

      const row = document.createElement("div");

      row.className="moveRow";

      row.innerHTML =
        "<span>"+(Math.floor(i/2)+1)+".</span>" +
        "<span>"+squareName(m.fr,m.fc)+"-"+squareName(m.tr,m.tc)+"</span>" +
        "<span></span>";

      moves.appendChild(row);

    }else{

      const rows = moves.querySelectorAll(".moveRow");

      rows[rows.length-1].children[2].textContent =
        squareName(m.fr,m.fc)+"-"+squareName(m.tr,m.tc);
    }
  });
}


/* =========================================
   قلب الرقعة
========================================= */

function flipBoard(){

  flipped = !flipped;

  renderBoard();
}


/* =========================================
   الساعة
========================================= */

function formatTime(seconds){

  let m = Math.floor(seconds/60);
  let s = seconds%60;

  return m + ":" + String(s).padStart(2,"0");
}


function startClock(){

  clearInterval(timerInterval);

  timerInterval = setInterval(()=>{

    if(turn==="white"){

      if(whiteSeconds>0)
        whiteSeconds--;

    }else{

      if(blackSeconds>0)
        blackSeconds--;
    }

    document.getElementById("whiteClock").textContent =
      formatTime(whiteSeconds);

    document.getElementById("blackClock").textContent =
      formatTime(blackSeconds);

  },1000);
}


/* =========================================
   مباراة جديدة
========================================= */

function newGame(){

  resetBoard();

  renderBoard();

  startClock();
}

</script>

</body>
        </html>
