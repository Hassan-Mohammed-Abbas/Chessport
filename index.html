<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><link rel="manifest" href="manifest.json"><title>Chessport</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#1d2b4a,#080c15 65%);color:#fff;font-family:Arial,Tahoma,sans-serif}header{text-align:center;padding:20px 15px;background:#080d18ee;border-bottom:1px solid #293650}.logo{font-size:30px;font-weight:bold}.tag{margin-top:6px;color:#94a3b8;font-size:14px}main{width:min(1050px,96%);margin:22px auto;display:grid;grid-template-columns:minmax(280px,650px) 320px;gap:22px;align-items:start}.card{background:#121a2b;border:1px solid #293650;border-radius:18px;padding:16px;box-shadow:0 18px 50px #0006}.player{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.bottom{margin-top:10px;margin-bottom:0}.name{font-weight:bold}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;background:#64748b;margin-left:7px}.active .dot{background:#22c55e}.clock{min-width:100px;padding:8px 12px;text-align:center;font-size:26px;font-weight:bold;background:#080d18;border-radius:10px}.low{color:#f87171}.board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);direction:ltr;border:5px solid #060a11;border-radius:10px;overflow:hidden}.sq{position:relative;display:flex;justify-content:center;align-items:center;font-size:clamp(30px,7.7vw,65px);cursor:pointer;user-select:none}.light{background:#f0d9b5}.dark{background:#b58863}.selected{outline:4px solid #f59e0b;outline-offset:-4px}.last{box-shadow:inset 0 0 0 5px #facc1580}.legal:after{content:"";position:absolute;width:19%;height:19%;border-radius:50%;background:#1118}.capture:after{content:"";position:absolute;width:78%;height:78%;border:5px solid #1116;border-radius:50%}h2{margin:2px 0 15px;font-size:20px}.status{padding:12px;border-radius:12px;background:#0b1221;text-align:center;color:#dbe4f0;margin-bottom:14px}label{display:block;color:#94a3b8;font-size:13px;margin:12px 0 5px}select,button{width:100%;padding:12px;border-radius:11px;border:1px solid #34415c;background:#0b1221;color:white;font-size:15px}button{margin-top:10px;border:0;background:#dc2626;font-weight:bold;cursor:pointer}.secondary{background:#25324a}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.stat{background:#0b1221;padding:10px;border-radius:10px;text-align:center;color:#94a3b8}.stat b{display:block;color:white;font-size:18px;margin-bottom:3px}.note{font-size:12px;color:#94a3b8;line-height:1.7;margin-top:14px}@media(max-width:800px){main{grid-template-columns:1fr}.board{max-width:650px;margin:auto}}
</style></head><body><header><div class="logo">♟ Chessport</div><div class="tag">منصة شطرنج عربية — تعمل على الهاتف والكمبيوتر</div></header><main><section class="card"><div id="blackPlayer" class="player"><span class="name"><i class="dot"></i>الأسود</span><span id="blackClock" class="clock">10:00</span></div><div id="board" class="board"></div><div id="whitePlayer" class="player bottom"><span class="name"><i class="dot"></i>الأبيض</span><span id="whiteClock" class="clock">10:00</span></div></section><section class="card"><h2>🎮 مباراة جديدة</h2><div id="status" class="status">دور الأبيض</div><label for="time">وقت المباراة</label><select id="time"><option value="1">1 دقيقة — Bullet</option><option value="3">3 دقائق — Blitz</option><option value="5">5 دقائق — Blitz</option><option value="10" selected>10 دقائق — Rapid</option><option value="30">30 دقيقة — Classic</option></select><button onclick="newGame()">♟ بدء مباراة</button><button class="secondary" onclick="flipBoard()">↕ قلب الرقعة</button><button id="install" class="secondary" hidden>📲 تثبيت التطبيق</button><div class="stats"><div class="stat"><b id="moves">0</b>النقلات</div><div class="stat"><b id="result">—</b>النتيجة</div></div><div class="note">Chessport<br><br>نسخة محلية تعمل على الجهاز نفسه. أضف التطبيق إلى الشاشة الرئيسية ليعمل كتطبيق.</div></section></main>
<script>
const glyph={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};let board,turn='w',selected=null,last=[],timers={w:600,b:600},interval,over=false,flipped=false,count=0;const enemy=c=>c==='w'?'b':'w',inside=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function initial(){return [['br','bn','bb','bq','bk','bb','bn','br'],['bp','bp','bp','bp','bp','bp','bp','bp'],[null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],[null,null,null,null,null,null,null,null],['wp','wp','wp','wp','wp','wp','wp','wp'],['wr','wn','wb','wq','wk','wb','wn','wr']]}
function pseudo(r,c,b=board){let p=b[r][c],out=[];if(!p)return out;let col=p[0],t=p[1],opp=enemy(col),add=(rr,cc)=>{if(!inside(rr,cc))return false;if(!b[rr][cc]){out.push([rr,cc]);return true}if(b[rr][cc][0]===opp)out.push([rr,cc]);return false};if(t==='p'){let d=col==='w'?-1:1,s=col==='w'?6:1;if(inside(r+d,c)&&!b[r+d][c]){out.push([r+d,c]);if(r===s&&!b[r+2*d][c])out.push([r+2*d,c])}for(let dc of[-1,1])if(inside(r+d,c+dc)&&b[r+d][c+dc]?.[0]===opp)out.push([r+d,c+dc])}else if(t==='n'){for(let [dr,dc] of[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]])add(r+dr,c+dc)}else if(t==='k'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(dr||dc)add(r+dr,c+dc)}else{let ds=[];if(t==='b'||t==='q')ds.push([-1,-1],[-1,1],[1,-1],[1,1]);if(t==='r'||t==='q')ds.push([-1,0],[1,0],[0,-1],[0,1]);for(let[dr,dc]of ds){let rr=r+dr,cc=c+dc;while(add(rr,cc)){rr+=dr;cc+=dc}}}return out}
function safe(b,col){let k;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]===col+'k')k=[r,c];if(!k)return false;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]?.[0]===enemy(col)&&pseudo(r,c,b).some(x=>x[0]===k[0]&&x[1]===k[1]))return false;return true}
function legal(r,c){let p=board[r][c];if(!p||p[0]!==turn)return[];return pseudo(r,c).filter(([rr,cc])=>{let b=board.map(x=>x.slice());b[rr][cc]=b[r][c];b[r][c]=null;return safe(b,turn)})}
function render(){let el=document.querySelector('#board');el.innerHTML='';let rs=[0,1,2,3,4,5,6,7],cs=[0,1,2,3,4,5,6,7];if(flipped){rs.reverse();cs.reverse()}let moves=selected?legal(...selected):[];for(let r of rs)for(let c of cs){let s=document.createElement('div');s.className='sq '+((r+c)%2?'dark':'light');if(last.some(x=>x[0]===r&&x[1]===c))s.classList.add('last');if(selected?.[0]===r&&selected[1]===c)s.classList.add('selected');if(moves.some(x=>x[0]===r&&x[1]===c)){s.classList.add('legal');if(board[r][c])s.classList.add('capture')}if(board[r][c])s.textContent=glyph[board[r][c][0]][board[r][c][1]];s.onclick=()=>click(r,c);el.appendChild(s)}whitePlayer.classList.toggle('active',turn==='w');blackPlayer.classList.toggle('active',turn==='b')}
function click(r,c){if(over)return;if(selected&&legal(...selected).some(x=>x[0]===r&&x[1]===c))return move(...selected,r,c);selected=board[r][c]?.[0]===turn?[r,c]:null;render()}
function move(r,c,rr,cc){board[rr][cc]=board[r][c];board[r][c]=null;if(board[rr][cc][1]==='p'&&(rr===0||rr===7))board[rr][cc]=turn+'q';last=[[r,c],[rr,cc]];selected=null;count++;moves.textContent=count;turn=enemy(turn);render();end()}
function end(){let any=false;for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(board[r][c]?.[0]===turn&&legal(r,c).length){any=true;break}if(!any){over=true;clearInterval(interval);let check=!safe(board,turn);status.textContent=check?'كش مات — '+(turn==='w'?'الأسود':'الأبيض')+' فاز':'تعادل — لا توجد نقلات';result.textContent=check?(turn==='w'?'0-1':'1-0'):'½-½'}else status.textContent=turn==='w'?'دور الأبيض':'دور الأسود'}
function fmt(s){return Math.floor(s/60)+':'+String(Math.max(0,s%60)).padStart(2,'0')}function tick(){if(over)return;let id=turn==='w'?'whiteClock':'blackClock';timers[turn]--;document.getElementById(id).textContent=fmt(timers[turn]);document.getElementById(id).classList.toggle('low',timers[turn]<=10);if(timers[turn]<=0){over=true;clearInterval(interval);let win=turn==='w'?'الأسود':'الأبيض';status.textContent='انتهى الوقت — '+win+' فاز';result.textContent=turn==='w'?'0-1':'1-0'}}
function newGame(){clearInterval(interval);board=initial();turn='w';selected=null;last=[];over=false;count=0;let t=+time.value*60;timers={w:t,b:t};whiteClock.textContent=blackClock.textContent=fmt(t);moves.textContent=0;result.textContent='—';status.textContent='دور الأبيض';document.querySelectorAll('.clock').forEach(x=>x.classList.remove('low'));render();interval=setInterval(tick,1000)}function flipBoard(){flipped=!flipped;render()}newGame();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.onclick=async()=>{if(deferred){deferred.prompt();deferred=null}};
</script></body></html>
